<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="grad-accent-Street Active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3155FF"/>
      <stop offset="100%" stop-color="#A8E63D"/>
    </linearGradient>
    <linearGradient id="grad-upper-Street Active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E2DC"/>
    </linearGradient>
    <filter id="street-shadow-Street Active" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Dynamic Geometric Backdrop Elements -->
  <circle cx="430" cy="240" r="170" fill="#3155FF" fill-opacity="0.14" />
  <rect x="520" y="80" width="120" height="28" rx="14" fill="#A8E63D" fill-opacity="0.15" />
  <text x="580" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#A8E63D">HIGH-TRACTION</text>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="430" rx="300" ry="22" fill="#000000" fill-opacity="0.10" filter="blur(14px)" />
  <ellipse cx="410" cy="425" rx="220" ry="12" fill="#000000" fill-opacity="0.15" filter="blur(6px)" />

  <!-- Sneaker Silhouette Group -->
  <g filter="url(#street-shadow-Street Active)" transform="translate(30, 25)">
    <!-- Outsole & Midsole Sculpted Ridges -->
    <path d="M 120 345 C 135 365, 175 385, 245 385 C 335 385, 415 370, 485 365 C 565 360, 645 370, 685 350 C 695 345, 690 325, 665 315 C 635 305, 545 310, 475 310 C 375 310, 265 305, 185 320 C 145 328, 115 332, 120 345 Z" fill="#0E0E0E" />

    <!-- High-Traction Lug Cutouts -->
    <path d="M 150 365 L 180 375 L 210 365 L 240 375 L 270 365 L 300 375 L 330 365 L 360 375 L 390 365 L 420 375 L 450 365 L 480 375 L 510 365 L 540 375 L 570 365 L 600 375 L 630 365 L 660 355" stroke="#3155FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Midsole Cushion Layer -->
    <path d="M 150 325 C 190 315, 290 310, 390 313 C 470 315, 560 305, 640 315 C 655 318, 658 295, 635 275 C 605 245, 555 205, 485 185 C 445 175, 415 190, 375 200 C 335 210, 295 195, 255 215 C 205 240, 165 280, 150 325 Z" fill="url(#grad-upper-Street Active)" />

    <!-- Streetwear Graphic Overlay & Speed Stripe -->
    <path d="M 230 285 C 310 265, 430 255, 580 285 C 530 295, 410 290, 230 285 Z" fill="url(#grad-accent-Street Active)" />

    <!-- Upper Panels & Stitch Lines -->
    <path d="M 260 215 C 300 195, 340 210, 380 200 C 420 190, 450 175, 490 185 C 520 195, 550 215, 580 245 C 540 255, 470 250, 410 240 C 350 230, 290 235, 260 215 Z" fill="#0E0E0E" opacity="0.85" />

    <!-- Tongue & Collar with Neon Piping -->
    <path d="M 340 200 C 355 155, 380 120, 420 110 C 455 102, 485 125, 490 175" stroke="#3155FF" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 340 200 C 355 155, 380 120, 420 110 C 455 102, 485 125, 490 175" stroke="#0E0E0E" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Kinetic Laces -->
    <line x1="400" y1="145" x2="435" y2="210" stroke="#A8E63D" stroke-width="4" stroke-linecap="round"/>
    <line x1="430" y1="155" x2="465" y2="220" stroke="#A8E63D" stroke-width="4" stroke-linecap="round"/>
    <line x1="460" y1="168" x2="490" y2="230" stroke="#A8E63D" stroke-width="4" stroke-linecap="round"/>

    <!-- Heel Pull Loop -->
    <path d="M 295 195 C 280 165, 295 150, 310 152 C 320 154, 315 180, 320 195" stroke="#3155FF" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Editorial Typography Tags -->
  <text x="45" y="480" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="3" fill="#111111">WALKLINE // STREET ACTIVE</text>
  <text x="755" y="480" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#555555">STREET EDITION</text>
</svg>