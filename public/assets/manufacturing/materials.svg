<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <rect width="800" height="600" fill="#141414"/>
  
  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="50" y1="0" x2="50" y2="600"/><line x1="100" y1="0" x2="100" y2="600"/><line x1="150" y1="0" x2="150" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="250" y1="0" x2="250" y2="600"/><line x1="300" y1="0" x2="300" y2="600"/><line x1="350" y1="0" x2="350" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="450" y1="0" x2="450" y2="600"/><line x1="500" y1="0" x2="500" y2="600"/><line x1="550" y1="0" x2="550" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/><line x1="650" y1="0" x2="650" y2="600"/><line x1="700" y1="0" x2="700" y2="600"/><line x1="750" y1="0" x2="750" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="450" x2="800" y2="450"/><line x1="0" y1="500" x2="800" y2="500"/><line x1="0" y1="550" x2="800" y2="550"/><line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- Central Technical Schematic Shape -->
  <g transform="translate(100, 80)">
    <!-- Outer Contour Ring -->
    <circle cx="300" cy="220" r="180" stroke="#D95D39" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
    <circle cx="300" cy="220" r="140" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

    <!-- Crosshair Target -->
    <line x1="100" y1="220" x2="500" y2="220" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <line x1="300" y1="20" x2="300" y2="420" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>

    <!-- Geometric Mold / Layer Profile -->
    <path d="M 160 260 C 200 240, 260 230, 320 235 C 380 240, 420 220, 450 250 L 430 290 C 370 280, 310 285, 250 295 L 160 260 Z" fill="#D95D39" fill-opacity="0.2" stroke="#D95D39" stroke-width="2"/>
    <path d="M 180 200 C 230 180, 300 175, 360 190 C 400 200, 420 215, 440 230" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Coordinate callouts -->
    <circle cx="360" cy="190" r="4" fill="#D95D39"/>
    <line x1="360" y1="190" x2="480" y2="120" stroke="#D95D39" stroke-width="1.5"/>
    <text x="490" y="124" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.8">TORSION ARCH (+0.42mm)</text>

    <circle cx="250" cy="295" r="4" fill="#FFFFFF"/>
    <line x1="250" y1="295" x2="160" y2="370" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <text x="60" y="374" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.8">EVA BOND ZONE (INJECTION)</text>
  </g>

  <!-- Typography & Headers -->
  <text x="50" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#D95D39">WL-MAT-02 // SPECIFICATION</text>
  <text x="50" y="540" font-family="system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#FFFFFF">POLYMERIC DUAL-DENSITY INJECTION</text>
  <text x="50" y="565" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#888888">High-rebound compound formulation & lightweight shock absorption</text>

  <rect x="680" y="40" width="70" height="24" rx="2" fill="none" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <text x="715" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#AAAAAA">FIG. 04</text>
</svg>